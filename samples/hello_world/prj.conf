# nothing here
#
#
CONFIG_ETH_E1000E=n

# Should be identical to scpu since its just another app.
# 0x80000000 == begining of (simulated) ROM
# 0x80006c00 == begining of RAM
#
# Recogni bootloadloader sample app
# Remove all these options if not building for bootloader
#
CONFIG_XIP=n
CONFIG_ETH_E1000E=n

# SRAM_SIZE : 512 (Phy sram siz) - 179 (Bootldr RAM & ROM) == 332 left for app.
# SRAM_BASE_ADDR: bootloader goes in first 179K. 0x8002cc00 == 0x80000000 | 179K
#
CONFIG_SRAM_SIZE=332
CONFIG_SRAM_BASE_ADDRESS=0x8002cc00
CONFIG_BOOTLOADER_MCUBOOT=y  

# West doesn't seem to be synchronized with the signing tool and get errors. so sign separatly.
#CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="modules/mcuboot/root-rsa-2048.pem"
