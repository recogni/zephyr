CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

CONFIG_MAIN_STACK_SIZE=4096

# FS abstraction layer is noisy so it's off.  Turn it on to see the
# littlefs configuration parameters.
#CONFIG_LOG=y
#CONFIG_FS_LOG_LEVEL_DBG=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_ZTEST=y
CONFIG_ZTEST_STACKSIZE=4096

CONFIG_SCORPIO_FLASH=y
CONFIG_SDMMC_SCORPIO=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_ACCESS=y

CONFIG_SCORPIO_LOAD_CODE_FROM_LPDDR=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_SCORPIO_SCPU=y

CONFIG_PMBUS=n
CONFIG_PMBUS_SHELL=n
CONFIG_ETH_SCORPIO=n
CONFIG_ETH_E1000E=y

CONFIG_FS_LITTLEFS_LOOKAHEAD_SIZE=512
CONFIG_FS_LITTLEFS_CACHE_SIZE=512
CONFIG_FS_LITTLEFS_READ_SIZE=512
CONFIG_FS_LITTLEFS_PROG_SIZE=512

